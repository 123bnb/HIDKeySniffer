name: Build HIDKeySniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDKeySniffer-1.0.7-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.7
          NOTES=$'HIDKeySniffer v1.0.7（roothide 直装）—— 翻页器=Digitizer 触摸确认版\n\n【重大突破】v1.0.6 实机日志确认：\n你的翻页器在 iOS 眼里是 HID Digitizer（触摸输入设备）！\n7 键全部以 type=11 触摸事件进入番茄小说进程（_UIHIDTransformer/_UIUpdateHIDDigitizerInput 都能收到），\n不依赖辅助触控开关。音量键（键盘consumer）是系统级，不经过 App UI 层。\n\n【本版做什么】\n1. 过滤心跳刷屏（type=17 compat + type=11 空闲事件不再打日志）\n2. hook _UIHIDTransformer.handleHIDEvent: 返回值 → 打印 UIKit 转换结果：\n   UIEvent type/subtype + 每根 UITouch 的 phase/坐标/pathIdentity/touchIdentifier\n3. 正确解析 digitizer float 字段（X=0x23/Y=0x24/事件掩码/索引/身份）\n\n【怎么测】\n1. 装 v1.0.7 → 注销\n2. 打开番茄小说，手指不碰屏幕，只按翻页器 7 键（每键按 1 次，间隔 1 秒）\n3. 把容器 Documents/HIDKeySniffer.log 发我\n\n【安全】只读不修改，原事件原样放行'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDKeySniffer v1.0.6" --notes "$NOTES"
          fi
