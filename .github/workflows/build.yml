name: Build HIDKeySniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDKeySniffer-1.0.6-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.6
          NOTES=$'HIDKeySniffer v1.0.6（roothide 直装）—— 自dump诊断版 v3\n\n【本次更新】\n修复编译错误：ARC 下 objc_msgSend 未声明，改 methodForSelector 取 IMP 调用字段方法\n\n【功能不变】\n注入番茄小说，hook 6 个真实 HID 入口（UIEventFetcher._receiveHIDEvent: 等），\n事件打印 type/senderID/usage/keyCode/坐标/按键 + isa，只读不修改原样放行\n\n【怎么测】\n1. 装 v1.0.6 → 注销\n2. 关闭辅助触控\n3. 打开番茄小说，7 键各按 2~3 下\n4. 把容器 Documents/HIDKeySniffer.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDKeySniffer v1.0.6" --notes "$NOTES"
          fi
