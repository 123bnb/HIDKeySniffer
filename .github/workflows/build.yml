name: Build HIDKeySniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDKeySniffer-1.0.3-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.3
          NOTES=$'HIDKeySniffer v1.0.3（roothide 直装）—— backboardd 层 HID 键码抓取\n\n【本次更新】\n日志双路径写入：/tmp/HIDKeySniffer.log（保底，绝对可写）+ /var/mobile/Documents/HIDKeySniffer.log\n\n【为什么 v1.0.2 无日志】\nbackboardd 是常驻 daemon，注销(respring)不会重启它 → dylib 根本没被加载。\n必须【重启手机】（关机再开机），不能只注销！\n\n【怎么测】\n1. 卸载旧版 HIDKeySniffer，安装 v1.0.3\n2. 【重启手机】（关键！不是注销）\n3. 关闭辅助触控\n4. 用翻页器 7 键各按 2~3 下\n5. Filza 读 /tmp/HIDKeySniffer.log 或 /var/mobile/Documents/HIDKeySniffer.log\n   能看到「v1.0.3 已注入 backboardd」就说明加载成功，把按键日志发我\n\n【注意】只读不修改，原事件原样放行；万一异常进安全模式，卸载即可恢复'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDKeySniffer v1.0.3" --notes "$NOTES"
          fi
